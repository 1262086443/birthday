<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎂 生日快乐，我的宝贝</title>
<style>
:root{
  --pink:#ff6fa5; --rose:#ff9ec4; --gold:#ffd27a; --violet:#8f74ff;
  --bg1:#0a0520; --bg2:#2a0f4a; --glass:rgba(255,255,255,.07); --line:rgba(255,255,255,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:#fff; background:linear-gradient(180deg,var(--bg1),var(--bg2) 45%,#3b1250 75%,#1a0a33);
  background-attachment:fixed; overflow-x:hidden; min-height:100vh;
}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:0} #fx{z-index:60} #cf{z-index:61}
section{position:relative;z-index:2;min-height:100vh;padding:110px 8vw;display:flex;flex-direction:column;align-items:center;justify-content:center}
.title{font-size:clamp(30px,3.4vw,50px);font-weight:800;letter-spacing:6px;text-align:center;margin-bottom:14px;
  background:linear-gradient(90deg,#ffd27a,#ff6fa5,#c9b6ff,#ffd27a);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.subtitle{color:rgba(255,255,255,.65);letter-spacing:3px;margin-bottom:56px;text-align:center}
@keyframes shine{to{background-position:300% 0}}
.reveal{opacity:0;transform:translateY(50px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
.reveal.show{opacity:1;transform:none}

/* 进度条 & 导航 & 音乐 */
#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:100;background:linear-gradient(90deg,var(--gold),var(--pink),var(--violet));box-shadow:0 0 12px var(--pink)}
#dots{position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:90;display:flex;flex-direction:column;gap:16px}
#dots a{position:relative;width:11px;height:11px;border-radius:50%;border:2px solid rgba(255,255,255,.5);transition:.3s;display:block}
#dots a.on{background:var(--pink);border-color:var(--pink);box-shadow:0 0 14px var(--pink);transform:scale(1.3)}
#dots a span{position:absolute;right:24px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:13px;opacity:0;transition:.3s;
  background:rgba(0,0,0,.55);padding:4px 10px;border-radius:20px;pointer-events:none}
#dots a:hover span{opacity:1}
#music{position:fixed;top:24px;right:28px;z-index:95;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);
  background:var(--glass);backdrop-filter:blur(10px);color:#fff;font-size:20px;cursor:pointer;transition:.3s}
#music:hover{box-shadow:0 0 20px var(--pink);transform:scale(1.1)}
#music.playing{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 开场 */
#intro{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 40%,#3a1466,#0a0520 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity 1.2s,visibility 1.2s}
#intro.hide{opacity:0;visibility:hidden}
#gift{font-size:130px;cursor:pointer;animation:giftShake 1.6s ease-in-out infinite;filter:drop-shadow(0 0 40px rgba(255,111,165,.8))}
@keyframes giftShake{0%,100%{transform:rotate(0) scale(1)}10%,30%{transform:rotate(-8deg) scale(1.06)}20%,40%{transform:rotate(8deg) scale(1.06)}50%{transform:rotate(0)}}
#intro h2{font-size:28px;letter-spacing:8px;font-weight:300}
#intro p{color:rgba(255,255,255,.6);letter-spacing:4px;animation:blink 1.8s infinite}
@keyframes blink{50%{opacity:.25}}

/* Hero */
#hero{text-align:center}
.halo{position:absolute;width:760px;height:760px;border-radius:50%;z-index:-1;opacity:.55;filter:blur(70px);
  background:conic-gradient(from 0deg,#ff6fa5,#8f74ff,#ffd27a,#ff6fa5);animation:spin 18s linear infinite}
.hb{font-family:"Brush Script MT","Segoe Script","Snell Roundhand","STKaiti","KaiTi",cursive;font-size:clamp(70px,10vw,150px);line-height:1.1;
  text-shadow:0 0 30px rgba(255,111,165,.7),0 0 80px rgba(143,116,255,.5)}
.hb span{display:inline-block;opacity:0;transform:translateY(80px) rotate(12deg) scale(.4);
  background:linear-gradient(180deg,#fff,#ffd27a 55%,#ff6fa5);-webkit-background-clip:text;background-clip:text;color:transparent}
#hero.go .hb span{animation:letterIn .9s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:calc(var(--i)*.07s + .3s)}
@keyframes letterIn{to{opacity:1;transform:none}}
.to{font-size:clamp(22px,2.4vw,34px);margin-top:20px;letter-spacing:10px;opacity:0}
#hero.go .to{animation:fadeUp 1.2s 1.8s forwards}
.type{margin-top:28px;min-height:36px;font-size:clamp(16px,1.5vw,22px);color:rgba(255,255,255,.85);letter-spacing:4px}
.cursor{display:inline-block;width:2px;height:1.1em;background:var(--rose);margin-left:4px;vertical-align:-3px;animation:blink 1s infinite}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.scroll{position:absolute;bottom:34px;font-size:13px;letter-spacing:4px;color:rgba(255,255,255,.55);animation:float 2s ease-in-out infinite}
.scroll::after{content:"";display:block;width:1px;height:46px;margin:10px auto 0;background:linear-gradient(var(--rose),transparent)}
@keyframes float{50%{transform:translateY(10px)}}

/* 时间轴 */
.timeline{position:relative;width:min(1000px,100%)}
.timeline::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);
  background:linear-gradient(transparent,var(--pink),var(--violet),transparent)}
.tl{position:relative;width:50%;padding:0 48px 54px 0}
.tl:nth-child(even){margin-left:50%;padding:0 0 54px 48px}
.tl::after{content:"❤";position:absolute;right:-11px;top:14px;width:22px;height:22px;display:grid;place-items:center;font-size:13px;color:var(--pink);
  background:#1a0a33;border-radius:50%;box-shadow:0 0 16px var(--pink)}
.tl:nth-child(even)::after{right:auto;left:-11px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:24px 28px;backdrop-filter:blur(14px);transition:.4s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 50px rgba(255,111,165,.25);border-color:var(--rose)}
.card small{color:var(--gold);letter-spacing:3px}
.card h3{margin:8px 0;font-size:21px}
.card p{color:rgba(255,255,255,.72);line-height:1.85;font-size:15px}

/* 蛋糕 */
#cakeWrap{position:relative;width:min(470px,90%)}
#cake{width:100%;filter:drop-shadow(0 30px 50px rgba(255,111,165,.35))}
#cake .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate;transition:opacity .35s,transform .35s}
#cake .flame:nth-child(2n){animation-duration:.23s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.12) rotate(3deg)}}
#cake.blown .flame{opacity:0;transform:scale(.2)}
.smoke{opacity:0;fill:#cfc8e8}
#cake.blown .smoke{animation:smoke 2.2s ease-out forwards}
@keyframes smoke{0%{opacity:.7;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-70px) scale(2.2)}}
.glow{animation:glowP 1.6s ease-in-out infinite alternate}
@keyframes glowP{to{opacity:.5}}
#cake.blown .glow{opacity:0;animation:none}
.btns{display:flex;gap:18px;margin-top:34px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 32px;border-radius:40px;border:none;font-size:16px;letter-spacing:2px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 10px 30px rgba(255,111,165,.4);transition:.3s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-4px) scale(1.04);box-shadow:0 16px 44px rgba(255,111,165,.65)}
.btn.ghost{background:var(--glass);border:1px solid var(--line);box-shadow:none;backdrop-filter:blur(10px)}
#wish{margin-top:30px;min-height:60px;font-size:22px;letter-spacing:4px;text-align:center;color:var(--gold);opacity:0;transition:1s}
#wish.on{opacity:1;text-shadow:0 0 20px rgba(255,210,122,.8)}

/* 相册 */
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,300px));gap:40px;justify-content:center}
.polaroid{background:#fff;padding:14px 14px 18px;border-radius:6px;color:#444;transform:rotate(var(--r));transition:.5s cubic-bezier(.2,.8,.2,1);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.polaroid:hover{transform:rotate(0) scale(1.08) translateY(-10px);z-index:5;box-shadow:0 30px 70px rgba(255,111,165,.5)}
.ph{aspect-ratio:1/1;border-radius:3px;overflow:hidden;display:grid;place-items:center;font-size:60px;text-align:center;background:var(--g)}
.ph img{width:100%;height:100%;object-fit:cover}
.ph em{display:block;font-size:12px;font-style:normal;color:rgba(255,255,255,.85);letter-spacing:2px;margin-top:8px}
.polaroid p{text-align:center;margin-top:14px;font-family:"KaiTi","STKaiti",cursive;font-size:18px}

/* 情书 */
.env{position:relative;width:360px;height:240px;cursor:pointer;transition:.8s;perspective:900px}
.env .body{position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,#ffb3d1,#ff7aa8);box-shadow:0 24px 60px rgba(255,111,165,.45)}
.env .flap{position:absolute;left:0;right:0;top:0;height:130px;background:linear-gradient(#ff9ec4,#ff7aa8);clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;transition:transform .9s;z-index:3;border-radius:10px 10px 0 0}
.env .seal{position:absolute;left:50%;top:104px;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;z-index:4;display:grid;place-items:center;font-size:26px;
  background:radial-gradient(circle at 35% 30%,#ff5c8a,#b0123f);box-shadow:0 4px 14px rgba(0,0,0,.4);transition:.5s;animation:beat 1.2s infinite}
@keyframes beat{50%{transform:translate(-50%,-50%) scale(1.18)}}
.env.open{transform:scale(.7);opacity:.0;height:0;margin-bottom:-30px;pointer-events:none}
.env.open .flap{transform:rotateX(180deg)} .env.open .seal{opacity:0}
.env-hint{margin-top:22px;color:rgba(255,255,255,.6);letter-spacing:4px;animation:blink 2s infinite}
.paper{width:min(760px,100%);max-height:0;overflow:hidden;opacity:0;transition:max-height 1.4s ease,opacity 1s,padding 1s;
  background:linear-gradient(180deg,#fffaf0,#fff1de);color:#5a3b3b;border-radius:14px;padding:0 54px;
  font-family:"KaiTi","STKaiti","Songti SC",serif;font-size:21px;line-height:2.1;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.paper.show{max-height:1400px;opacity:1;padding:54px}
.paper .sign{text-align:right;margin-top:20px;color:#c2386b}

/* 翻转卡 */
.flips{display:grid;grid-template-columns:repeat(3,260px);gap:34px;justify-content:center}
.flip{height:200px;perspective:1000px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip:hover .in,.flip.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;backface-visibility:hidden;padding:22px;text-align:center}
.front{background:linear-gradient(135deg,rgba(255,111,165,.35),rgba(143,116,255,.35));border:1px solid var(--line);backdrop-filter:blur(12px);font-size:46px}
.front b{font-size:15px;letter-spacing:4px;font-weight:400;color:var(--gold)}
.back{transform:rotateY(180deg);background:linear-gradient(135deg,#ff6fa5,#8f74ff);line-height:1.8;font-size:16px;box-shadow:0 14px 40px rgba(255,111,165,.5)}

/* 终章 */
#finale{text-align:center}
.big{font-size:clamp(46px,6vw,90px);font-weight:900;letter-spacing:10px;
  background:linear-gradient(90deg,#ffd27a,#ff6fa5,#8f74ff,#ffd27a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite;
  filter:drop-shadow(0 0 30px rgba(255,111,165,.5))}
.count{display:flex;gap:22px;margin:46px 0 14px;justify-content:center}
.count div{width:112px;padding:20px 0;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px)}
.count b{display:block;font-size:40px;font-variant-numeric:tabular-nums;color:var(--gold)}
.count span{font-size:13px;letter-spacing:4px;color:rgba(255,255,255,.65)}
.foot{margin-top:60px;color:rgba(255,255,255,.5);letter-spacing:3px;font-size:14px}
</style>
</head>
<body>

<canvas id="bg"></canvas><canvas id="fx"></canvas><canvas id="cf"></canvas>
<div id="progress"></div>
<nav id="dots"></nav>
<button id="music" title="音乐开关">🎵</button>

<div id="intro">
  <div id="gift">🎁</div>
  <h2>有一份礼物，只送给你</h2>
  <p>点击礼物盒，打开惊喜</p>
</div>

<!-- 1 首页 -->
<section id="hero" data-title="序章">
  <div class="halo"></div>
  <div class="hb" id="hb"></div>
  <div class="to" id="toName"></div>
  <div class="type"><span id="typed"></span><span class="cursor"></span></div>
  <div class="scroll">向下滑动</div>
</section>

<!-- 2 故事 -->
<section id="story" data-title="我们的故事">
  <h2 class="title reveal">我们的故事</h2>
  <p class="subtitle reveal">每一个瞬间，都是我偷偷收藏的星光</p>
  <div class="timeline" id="timeline"></div>
</section>

<!-- 3 蛋糕 -->
<section id="cakeSec" data-title="许愿">
  <h2 class="title reveal">许个愿吧</h2>
  <p class="subtitle reveal">闭上眼睛，认真许愿，然后吹灭蜡烛</p>
  <div id="cakeWrap" class="reveal">
    <svg id="cake" viewBox="0 0 400 380">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc2dc"/><stop offset="1" stop-color="#ff6fa5"/></linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7b0"/><stop offset="1" stop-color="#ffb457"/></linearGradient>
        <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9ccff"/><stop offset="1" stop-color="#8f74ff"/></linearGradient>
        <radialGradient id="fl" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#ffe27a"/><stop offset="1" stop-color="#ff7a2a"/></radialGradient>
        <radialGradient id="gl"><stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
      </defs>
      <ellipse cx="200" cy="334" rx="180" ry="24" fill="#ffffff" opacity=".12"/>
      <ellipse cx="200" cy="326" rx="168" ry="19" fill="#f6efff"/>
      <rect x="60" y="235" width="280" height="90" rx="16" fill="url(#g1)"/>
      <path d="M60,250 Q77,280 95,250 T130,250 T165,250 T200,250 T235,250 T270,250 T305,250 T340,250 V235 H60Z" fill="#fff6fb"/>
      <rect x="95" y="165" width="210" height="74" rx="13" fill="url(#g2)"/>
      <path d="M95,178 Q112,206 130,178 T165,178 T200,178 T235,178 T270,178 T305,178 V165 H95Z" fill="#fffaf0"/>
      <rect x="130" y="100" width="140" height="68" rx="11" fill="url(#g3)"/>
      <path d="M130,112 Q147,140 165,112 T200,112 T235,112 T270,112 V100 H130Z" fill="#f8f4ff"/>
      <text x="200" y="222" text-anchor="middle" font-size="24" fill="#fff" font-family="Brush Script MT,Segoe Script,cursive" style="letter-spacing:2px">Happy Birthday</text>
      <g fill="#fff" opacity=".9">
        <circle cx="90" cy="288" r="4"/><circle cx="135" cy="300" r="4"/><circle cx="180" cy="292" r="4"/><circle cx="230" cy="302" r="4"/><circle cx="280" cy="290" r="4"/><circle cx="315" cy="302" r="4"/>
        <circle cx="150" cy="150" r="3.5" fill="#ff6fa5"/><circle cx="250" cy="152" r="3.5" fill="#ff6fa5"/>
      </g>
      <g id="candles"></g>
    </svg>
  </div>
  <div id="wish"></div>
  <div class="btns reveal">
    <button class="btn" id="blowBtn">🕯️ 吹灭蜡烛</button>
    <button class="btn ghost" id="micBtn">🎤 对着屏幕吹一口气</button>
    <button class="btn ghost" id="relightBtn">✨ 再许一个愿</button>
  </div>
</section>

<!-- 4 相册 -->
<section id="photos" data-title="相册">
  <h2 class="title reveal">时光相册</h2>
  <p class="subtitle reveal">把想你的时候，都洗成了照片</p>
  <div class="gallery" id="gallery"></div>
</section>

<!-- 5 情书 -->
<section id="letterSec" data-title="情书">
  <h2 class="title reveal">写给你的信</h2>
  <p class="subtitle reveal">有些话，只想说给你一个人听</p>
  <div class="env" id="env"><div class="body"></div><div class="flap"></div><div class="seal">💌</div></div>
  <div class="env-hint" id="envHint">点击信封，拆开它</div>
  <div class="paper" id="paper"><div id="letterText"></div><div class="sign" id="sign"></div></div>
</section>

<!-- 6 理由 -->
<section id="reasons" data-title="爱你的理由">
  <h2 class="title reveal">爱你的理由</h2>
  <p class="subtitle reveal">把鼠标移上去，翻开每一个答案</p>
  <div class="flips" id="flips"></div>
</section>

<!-- 7 终章 -->
<section id="finale" data-title="终章">
  <div class="big reveal">生日快乐</div>
  <p class="subtitle reveal" style="margin:18px 0 0" id="finalLine"></p>
  <div class="count reveal">
    <div><b id="cd">0</b><span>天</span></div><div><b id="ch">0</b><span>时</span></div>
    <div><b id="cm">0</b><span>分</span></div><div><b id="cs">0</b><span>秒</span></div>
  </div>
  <p class="subtitle reveal" style="margin:0 0 36px">这是我们相爱的时间，而且还在不停增加</p>
  <button class="btn reveal" id="moreFW">🎆 再放一场烟花</button>
  <div class="foot reveal" id="foot"></div>
</section>

<script>
/* ================= ✏️ 在这里修改成你们自己的内容 ================= */
const CONFIG = {
  name: "宝贝",                         // 她的称呼 / 名字
  from: "爱你的我",                      // 落款
  loveStart: "2022-02-14T00:00:00",     // 在一起的日期
  typeLines: [
    "今天，是全世界最特别的一天",

  story: [
    {date:"2022 · 02 · 14", title:"遇见你", text:"那一天，世界突然有了颜色。我还不知道，从此以后我所有的故事里都会有你。"},
    {date:"2022 · 05 · 20", title:"第一次牵手", text:"你的手很小很暖，我握着它，就像握住了整个春天。"},

    {date:"今天", title:"你的生日", text:"又长大一岁的你，依然是我心里那个最闪亮的小朋友。"}
  ],
  photos: [   // src 填照片路径，例如 "img/1.jpg"；留空则显示占位
    {src:"", caption:"第一次约会"}, {src:"", caption:"那天的晚霞"}, {src:"", caption:"你笑起来的样子"},
    {src:"", caption:"我们的小旅行"}, {src:"", caption:"傻乎乎的你"}, {src:"", caption:"未完待续…"}
  ],
  letter:
"亲爱的"+"{name}"+"：\n\n今天是你的生日，我想把所有的温柔都装进这一页里送给你。\n\n谢谢你出现在我的生命里，让平凡的日子都有了光。你开心的时候，我的世界是晴天；你皱眉的时候，我就想把所有不开心都赶走。\n\n愿你永远被爱，永远勇敢，永远天真。愿你想做的事都能成，想见的人都能见。\n\n而我，会一直在你身后，也会一直牵着你的手。\n\n生日快乐，我最爱的人。",
  reasons: [
    {icon:"😊", t:"你的笑", d:"你一笑，我所有的烦恼都投降了"},
    {icon:"🌙", t:"你的温柔", d:"你把世界的棱角，都温柔地抚平"},
    {icon:"🍀", t:"你的可爱", d:"偶尔犯迷糊的样子，让我心动一百遍"},
    {icon:"🔥", t:"你的认真", d:"认真生活的你，在发光"},
    {icon:"🎈", t:"和你在一起", d:"无论做什么，只要有你就很开心"},
    {icon:"💫", t:"就是你", d:"没有理由，因为是你，所以是你"}
  ],
  finalLine: "愿你被世界温柔以待，更被我温柔以待"
};
/* ================================================================= */

const $=s=>document.querySelector(s), rnd=(a,b)=>Math.random()*(b-a)+a, dpr=Math.min(devicePixelRatio||1,2);
let W,H;
const bg=$('#bg'),fx=$('#fx'),cf=$('#cf'),bctx=bg.getContext('2d'),fctx=fx.getContext('2d'),cctx=cf.getContext('2d');
function resize(){W=innerWidth;H=innerHeight;[bg,fx,cf].forEach(c=>{c.width=W*dpr;c.height=H*dpr;c.getContext('2d').setTransform(dpr,0,0,dpr,0,0)})}
addEventListener('resize',resize);resize();

/* ---------- 星空 + 爱心 + 流星 ---------- */
const stars=Array.from({length:170},()=>({x:rnd(0,1),y:rnd(0,1),r:rnd(.4,1.7),p:rnd(0,6.28),s:rnd(.01,.04)}));
const hearts=Array.from({length:26},()=>newHeart(true));
const meteors=[];
function newHeart(init){return{x:rnd(0,innerWidth),y:init?rnd(0,innerHeight):innerHeight+30,s:rnd(10,28),v:rnd(.25,.8),p:rnd(0,6.28),h:rnd(320,350),a:rnd(.12,.4)}}
function heartPath(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.3);c.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);c.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s);
  c.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3);c.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);c.closePath()}
function drawBG(t){
  bctx.clearRect(0,0,W,H);
  for(const s of stars){const a=.4+.6*Math.abs(Math.sin(t*s.s+s.p));bctx.fillStyle=`rgba(255,255,255,${a})`;bctx.beginPath();bctx.arc(s.x*W,s.y*H,s.r,0,6.28);bctx.fill()}
  for(const h of hearts){h.y-=h.v;h.p+=.02;h.x+=Math.sin(h.p)*.4;if(h.y<-40)Object.assign(h,newHeart(false));
    bctx.fillStyle=`hsla(${h.h},100%,72%,${h.a})`;bctx.shadowColor=`hsla(${h.h},100%,70%,.8)`;bctx.shadowBlur=14;heartPath(bctx,h.x,h.y,h.s);bctx.fill()}
  bctx.shadowBlur=0;
  if(Math.random()<.004)meteors.push({x:rnd(W*.3,W),y:rnd(0,H*.4),l:rnd(120,220),v:rnd(9,14),a:1});
  for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.x-=m.v;m.y+=m.v*.55;m.a-=.012;
    const g=bctx.createLinearGradient(m.x,m.y,m.x+m.l,m.y-m.l*.55);g.addColorStop(0,`rgba(255,255,255,${m.a})`);g.addColorStop(1,'rgba(255,255,255,0)');
    bctx.strokeStyle=g;bctx.lineWidth=2;bctx.beginPath();bctx.moveTo(m.x,m.y);bctx.lineTo(m.x+m.l,m.y-m.l*.55);bctx.stroke();
    if(m.a<=0)meteors.splice(i,1)}
}

/* ---------- 烟花 ---------- */
const parts=[],rockets=[],confetti=[];
const COLORS=[345,330,45,280,200,160,20];
function launch(x,y){rockets.push({x:x+rnd(-60,60),y:H+10,tx:x,ty:y,h:COLORS[Math.floor(rnd(0,COLORS.length))]})}
function explode(x,y,h){
  const type=['heart','burst','ring','heart','willow'][Math.floor(rnd(0,5))],n=type==='heart'?110:100;
  const sc=rnd(.8,1.3);
  for(let i=0;i<n;i++){
    let vx,vy;const a=i/n*6.28;
    if(type==='heart'){const t=a;vx=16*Math.pow(Math.sin(t),3)*.26*sc;vy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*.26*sc}
    else if(type==='ring'){const sp=4.2*sc;vx=Math.cos(a)*sp;vy=Math.sin(a)*sp}
    else{const sp=rnd(1,6.2)*sc;vx=Math.cos(a)*sp;vy=Math.sin(a)*sp}
    parts.push({x,y,vx,vy,a:1,d:type==='willow'?rnd(.006,.011):rnd(.011,.02),h:h+rnd(-14,14),g:type==='willow'?.05:.035,s:rnd(1.5,2.8),f:.975})
  }
  for(let i=0;i<20;i++)parts.push({x,y,vx:rnd(-1.5,1.5),vy:rnd(-1.5,1.5),a:1,d:.03,h:50,g:.02,s:2.5,f:.95,w:1})
}
function drawFX(){
  fctx.globalCompositeOperation='destination-out';fctx.fillStyle='rgba(0,0,0,.22)';fctx.fillRect(0,0,W,H);
  fctx.globalCompositeOperation='lighter';
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.x+=(r.tx-r.x)*.06;r.y+=Math.max((r.ty-r.y)*.07,-16);
    parts.push({x:r.x,y:r.y,vx:rnd(-.3,.3),vy:rnd(.3,1),a:.8,d:.06,h:r.h,g:0,s:1.6,f:.95});
    if(Math.abs(r.ty-r.y)<14){explode(r.x,r.y,r.h);rockets.splice(i,1)}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.vx*=p.f;p.vy*=p.f;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.a-=p.d;
    if(p.a<=0){parts.splice(i,1);continue}
    fctx.fillStyle=p.w?`rgba(255,240,200,${p.a})`:`hsla(${p.h},100%,${55+p.a*20}%,${p.a})`;
    fctx.beginPath();fctx.arc(p.x,p.y,p.s*(.5+p.a*.5),0,6.28);fctx.fill()}
  fctx.globalCompositeOperation='source-over';
  // 彩带
  cctx.clearRect(0,0,W,H);
  for(let i=confetti.length-1;i>=0;i--){const c=confetti[i];c.vy+=.12;c.vx*=.985;c.vy*=.985;c.x+=c.vx+Math.sin(c.sw+=.08)*1.2;c.y+=c.vy;c.r+=c.vr;
    if(c.y>H+30){confetti.splice(i,1);continue}
    cctx.save();cctx.translate(c.x,c.y);cctx.rotate(c.r);cctx.scale(1,Math.cos(c.sw));cctx.fillStyle=c.c;
    if(c.round){cctx.beginPath();cctx.arc(0,0,c.w/2,0,6.28);cctx.fill()}else cctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);cctx.restore()}
}
function confettiBurst(x,y,n=120){for(let i=0;i<n;i++){const a=rnd(-Math.PI,0),sp=rnd(5,16);
  confetti.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,w:rnd(6,12),h:rnd(10,18),r:rnd(0,6),vr:rnd(-.2,.2),sw:rnd(0,6),round:Math.random()<.3,c:`hsl(${rnd(0,360)},95%,65%)`})}}
function confettiRain(n=160){for(let i=0;i<n;i++)confetti.push({x:rnd(0,W),y:rnd(-H*.6,-10),vx:rnd(-1,1),vy:rnd(1,4),w:rnd(6,11),h:rnd(10,16),r:rnd(0,6),vr:rnd(-.15,.15),sw:rnd(0,6),round:Math.random()<.3,c:`hsl(${rnd(0,360)},95%,65%)`})}
function show(n=5,gap=260){for(let i=0;i<n;i++)setTimeout(()=>launch(rnd(W*.15,W*.85),rnd(H*.12,H*.5)),i*gap)}

addEventListener('click',e=>{if(e.target.closest('button,#env,.flip,#intro,#dots'))return;launch(e.clientX,e.clientY)});
addEventListener('mousemove',e=>{if(Math.random()<.6)parts.push({x:e.clientX+rnd(-4,4),y:e.clientY+rnd(-4,4),vx:rnd(-.6,.6),vy:rnd(-.6,.6),a:.9,d:.035,h:rnd(320,360),g:.02,s:rnd(1,2.4),f:.95})});
let autoOn=false;setInterval(()=>{if(autoOn&&!document.hidden)launch(rnd(W*.1,W*.9),rnd(H*.1,H*.45))},2600);

function loop(t){drawBG(t/16);drawFX();requestAnimationFrame(loop)}requestAnimationFrame(loop);

/* ---------- 音乐（Web Audio 合成《生日快乐歌》） ---------- */
let AC,master,musicOn=false,musicTimer;
const N={C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,Bb4:466.16,C5:523.25};
const SONG=[['C4',.75],['C4',.25],['D4',1],['C4',1],['F4',1],['E4',2],['C4',.75],['C4',.25],['D4',1],['C4',1],['G4',1],['F4',2],
  ['C4',.75],['C4',.25],['C5',1],['A4',1],['F4',1],['E4',1],['D4',2],['Bb4',.75],['Bb4',.25],['A4',1],['F4',1],['G4',1],['F4',2]];
function initAudio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.5;
  const d=AC.createDelay();d.delayTime.value=.28;const fb=AC.createGain();fb.gain.value=.32;d.connect(fb);fb.connect(d);master.connect(d);d.connect(AC.destination);master.connect(AC.destination)}
function playSong(){
  if(!musicOn)return;const beat=.46;let t=AC.currentTime+.1;
  SONG.forEach(([n,b])=>{const f=N[n];[[f,'triangle',.22],[f*2,'sine',.06],[f/2,'sine',.08]].forEach(([fr,ty,v])=>{
    const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=fr;o.connect(g);g.connect(master);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+b*beat*.95);o.start(t);o.stop(t+b*beat)});t+=b*beat});
  musicTimer=setTimeout(playSong,(t-AC.currentTime+2.5)*1000)}
function setMusic(on){musicOn=on;$('#music').classList.toggle('playing',on);$('#music').textContent=on?'🎵':'🔇';
  if(on){initAudio();AC.resume();clearTimeout(musicTimer);playSong()}else clearTimeout(musicTimer)}
$('#music').onclick=()=>setMusic(!musicOn);

/* ---------- 文字工具 ---------- */
function typeText(el,text,speed=70){return new Promise(res=>{let i=0;el.textContent='';(function step(){el.textContent=text.slice(0,i++);if(i<=text.length)setTimeout(step,speed);else res()})()})}
async function typeLoop(){let i=0;while(true){const s=CONFIG.typeLines[i++%CONFIG.typeLines.length];await typeText($('#typed'),s,90);await new Promise(r=>setTimeout(r,2200));
  for(let k=s.length;k>=0;k--){$('#typed').textContent=s.slice(0,k);await new Promise(r=>setTimeout(r,25))}await new Promise(r=>setTimeout(r,300))}}

/* ---------- 构建页面 ---------- */
$('#hb').innerHTML=[...'Happy Birthday'].map((c,i)=>`<span style="--i:${i}">${c===' '?'&nbsp;':c}</span>`).join('');
$('#toName').textContent='To  '+CONFIG.name;
$('#timeline').innerHTML=CONFIG.story.map(s=>`<div class="tl reveal"><div class="card"><small>${s.date}</small><h3>${s.title}</h3><p>${s.text}</p></div></div>`).join('');
const grads=['#ff9ec4,#8f74ff','#ffd27a,#ff6fa5','#8f74ff,#4fc3f7','#ff6fa5,#ffb457','#7ee0c3,#8f74ff','#ffb3d1,#c9b6ff'],emojis=['🌸','🌇','😆','✈️','🧸','💖'],rots=[-4,3,-2,4,-3,2];
$('#gallery').innerHTML=CONFIG.photos.map((p,i)=>`<div class="polaroid reveal" style="--r:${rots[i%6]}deg"><div class="ph" style="--g:linear-gradient(135deg,${grads[i%6]})">${p.src?`<img src="${p.src}" alt="">`:`<div>${emojis[i%6]}<em>放一张照片在这里</em></div>`}</div><p>${p.caption}</p></div>`).join('');
$('#flips').innerHTML=CONFIG.reasons.map(r=>`<div class="flip reveal"><div class="in"><div class="face front">${r.icon}<b>${r.t}</b></div><div class="face back">${r.d}</div></div></div>`).join('');
document.querySelectorAll('.flip').forEach(f=>f.addEventListener('click',()=>f.classList.toggle('f')));
$('#sign').textContent='— '+CONFIG.from;
$('#finalLine').textContent=CONFIG.finalLine;
$('#foot').textContent='Made with ❤ for '+CONFIG.name;

// 蜡烛
const cx=[150,175,200,225,250],cc=['#ff6fa5','#ffd27a','#8f74ff','#7ee0c3','#ff9ec4'];
$('#candles').innerHTML=cx.map((x,i)=>`<rect x="${x-4}" y="64" width="8" height="38" rx="2" fill="${cc[i]}"/><path d="M${x-4},74 l8,5 M${x-4},84 l8,5 M${x-4},94 l8,5" stroke="#fff" stroke-width="2" opacity=".7"/>
<g transform="translate(${x},58)"><circle class="glow" r="26" cy="-8" fill="url(#gl)"/><g class="flame"><path d="M0,-24 C8,-12 7,-1 0,0 C-7,-1 -8,-12 0,-24Z" fill="url(#fl)"/></g><circle class="smoke" r="5" cy="-6"/></g>`).join('');

/* ---------- 蛋糕交互 ---------- */
const wishes=['愿你岁岁平安，万事胜意 🌟','愿你所愿皆成真 💖','愿你永远十八岁，永远有人宠 🎀','愿你的每一天都闪闪发光 ✨'];
let blown=false;
function blowOut(){if(blown)return;blown=true;$('#cake').classList.add('blown');
  const r=$('#cake').getBoundingClientRect();confettiBurst(r.left+r.width/2,r.top+r.height*.3,160);confettiRain(140);show(7,220);
  const w=$('#wish');w.textContent=wishes[Math.floor(rnd(0,wishes.length))];w.classList.add('on')}
$('#blowBtn').onclick=blowOut;$('#cake').onclick=blowOut;
$('#relightBtn').onclick=()=>{blown=false;$('#cake').classList.remove('blown');$('#wish').classList.remove('on')};
$('#micBtn').onclick=async()=>{
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});const ac=new (window.AudioContext||window.webkitAudioContext)();
    const an=ac.createAnalyser();an.fftSize=512;ac.createMediaStreamSource(st).connect(an);const buf=new Uint8Array(an.fftSize);let hit=0;
    $('#micBtn').textContent='🎤 正在聆听…用力吹！';
    (function tick(){an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const d=(v-128)/128;s+=d*d}const rms=Math.sqrt(s/buf.length);
      hit=rms>.12?hit+1:Math.max(0,hit-1);
      if(hit>6){st.getTracks().forEach(t=>t.stop());ac.close();$('#micBtn').textContent='🎤 对着屏幕吹一口气';blowOut();return}
      if(!blown||true)requestAnimationFrame(tick)})()
  }catch(e){alert('无法使用麦克风，直接点击"吹灭蜡烛"吧～')}};

/* ---------- 情书 ---------- */
let opened=false;
$('#env').onclick=async()=>{if(opened)return;opened=true;$('#env').classList.add('open');$('#envHint').style.display='none';confettiBurst(innerWidth/2,innerHeight*.6,60);
  await new Promise(r=>setTimeout(r,900));$('#paper').classList.add('show');
  await typeText($('#letterText'),CONFIG.letter.replace('{name}',CONFIG.name),70);
  $('#letterText').style.whiteSpace='pre-wrap'};
$('#letterText').style.whiteSpace='pre-wrap';

/* ---------- 计时器 ---------- */
function tick(){const d=Date.now()-new Date(CONFIG.loveStart).getTime(),s=Math.max(0,Math.floor(d/1000));
  $('#cd').textContent=Math.floor(s/86400);$('#ch').textContent=Math.floor(s%86400/3600);$('#cm').textContent=Math.floor(s%3600/60);$('#cs').textContent=s%60}
setInterval(tick,1000);tick();
$('#moreFW').onclick=()=>{show(9,200);confettiRain(120)};

/* ---------- 滚动：进度条 / 导航点 / 出现动画 ---------- */
const secs=[...document.querySelectorAll('section')];
$('#dots').innerHTML=secs.map(s=>`<a href="#${s.id}"><span>${s.dataset.title}</span></a>`).join('');
const dotEls=[...document.querySelectorAll('#dots a')];
addEventListener('scroll',()=>{const h=document.documentElement;$('#progress').style.width=(scrollY/(h.scrollHeight-innerHeight)*100)+'%';
  let cur=0;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<innerHeight*.5)cur=i});dotEls.forEach((d,i)=>d.classList.toggle('on',i===cur))});
dispatchEvent(new Event('scroll'));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');
  if(e.target.classList.contains('big')){confettiRain(80);show(3,300)}}}),{threshold:.15});
document.querySelectorAll('.reveal').forEach((el,i)=>io.observe(el));

/* ---------- 开场 ---------- */
$('#gift').onclick=()=>{
  const r=$('#gift').getBoundingClientRect();confettiBurst(r.left+r.width/2,r.top+r.height/2,200);show(8,180);
  setMusic(true);$('#intro').classList.add('hide');
  setTimeout(()=>{$('#hero').classList.add('go');autoOn=true;typeLoop();confettiRain(120)},700)};
</script>
