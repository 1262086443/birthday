<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小 Clawd 的第一次剪辑</title>

<style>
:root {
  --orange: #ff8b45;
  --orange-dark: #d95b29;
  --cream: #fff0d2;
  --purple: #7e66ff;
  --blue: #36c7ff;
  --ink: #25213d;
  --panel: #17182c;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #11101f;
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "PingFang SC",
    "Microsoft YaHei",
    sans-serif;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;
}

#stage {
  position: relative;
  width: min(100vw, 1200px);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  color: white;
  background:
    radial-gradient(circle at 72% 20%, rgba(110, 109, 255, .35), transparent 25%),
    radial-gradient(circle at 18% 80%, rgba(255, 122, 94, .23), transparent 28%),
    linear-gradient(135deg, #1d2146, #44306f 52%, #192b58);
  box-shadow: 0 30px 100px rgba(0, 0, 0, .5);
}

/* 桌面背景上的装饰光 */
#stage::before,
#stage::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  filter: blur(3px);
  pointer-events: none;
}

#stage::before {
  width: 36%;
  aspect-ratio: 1;
  left: -10%;
  bottom: -24%;
  background: rgba(255, 151, 107, .16);
}

#stage::after {
  width: 25%;
  aspect-ratio: 1;
  right: 8%;
  top: 7%;
  background: rgba(87, 201, 255, .12);
}

/* 顶部菜单栏 */
.menu-bar {
  position: absolute;
  inset: 0 0 auto;
  height: 5.5%;
  min-height: 28px;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 2.2%;
  color: rgba(255, 255, 255, .9);
  font-size: clamp(9px, 1.1vw, 14px);
  background: rgba(20, 19, 42, .34);
  backdrop-filter: blur(15px);
}

.menu-left,
.menu-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.apple {
  font-size: 1.35em;
  font-weight: 700;
}

/* 桌面文件 */
.desktop-files {
  position: absolute;
  right: 3%;
  top: 13%;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 13px;
  align-items: center;
}

.file-icon {
  width: clamp(38px, 5vw, 62px);
  text-align: center;
  font-size: clamp(8px, 1vw, 12px);
  color: white;
  text-shadow: 0 2px 5px #15122b;
  transition: transform .3s, opacity .3s;
}

.file-icon:hover {
  transform: translateY(-4px) scale(1.08);
}

.file-picture {
  width: 100%;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  margin-bottom: 4px;
  border-radius: 15px;
  background: linear-gradient(145deg, #ffb56b, #f15c8a);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.2),
              0 8px 14px rgba(0,0,0,.2);
  font-size: 1.9em;
}

.file-icon:nth-child(2) .file-picture {
  background: linear-gradient(145deg, #4fe1ff, #5e6fff);
}

.file-icon:nth-child(3) .file-picture {
  background: linear-gradient(145deg, #a96aff, #ef67bf);
}

/* Dock */
.dock {
  position: absolute;
  left: 50%;
  bottom: 3.5%;
  z-index: 42;
  display: flex;
  gap: clamp(5px, .7vw, 10px);
  padding: clamp(5px, .8vw, 10px);
  transform: translateX(-50%);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 19px;
  background: rgba(255,255,255,.17);
  box-shadow: 0 14px 30px rgba(0,0,0,.25);
  backdrop-filter: blur(18px);
}

.dock-icon {
  width: clamp(30px, 4vw, 53px);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 14px;
  font-size: clamp(17px, 2.2vw, 29px);
  background: linear-gradient(145deg, #f8f8ff, #bfc9ff);
  box-shadow: 0 4px 5px rgba(0,0,0,.2);
  transition: transform .25s;
}

.dock-icon:hover {
  transform: translateY(-10px) scale(1.1);
}

.dock-icon.clawdcut {
  background: linear-gradient(145deg, #a994ff, #5145ce);
}

.dock-icon.trash {
  background: linear-gradient(145deg, #d8e4ff, #8191b6);
}

/* 文件夹窗口 */
.folder-window {
  position: absolute;
  left: 9%;
  top: 18%;
  z-index: 15;
  width: 37%;
  height: 41%;
  overflow: hidden;
  opacity: 0;
  transform: translateY(20px) scale(.92);
  border: 1px solid rgba(255,255,255,.28);
  border-radius: 14px;
  background: rgba(236, 239, 255, .94);
  color: #343653;
  box-shadow: 0 25px 55px rgba(0,0,0,.3);
  transition: opacity .7s, transform .7s;
}

.folder-window.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.window-head {
  height: 13%;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  background: rgba(220, 224, 247, .9);
  font-size: clamp(9px, 1vw, 13px);
  font-weight: 700;
}

.traffic {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff635d;
  box-shadow: 13px 0 #ffbd44, 26px 0 #28ca42;
  margin-right: 26px;
}

.folder-content {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 15px;
}

.video-thumb {
  aspect-ratio: 1.3;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: linear-gradient(135deg, #ff9b70, #884df4);
  color: white;
  font-size: clamp(17px, 2vw, 28px);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.2);
}

.video-thumb:nth-child(2) {
  background: linear-gradient(135deg, #42d8ff, #3865f1);
}

.video-thumb:nth-child(3) {
  background: linear-gradient(135deg, #ffa64a, #ff527d);
}

.video-thumb:nth-child(4) {
  background: linear-gradient(135deg, #70e2a4, #3585e9);
}

/* 剪辑软件 */
.editor-window {
  position: absolute;
  left: 7%;
  top: 10%;
  z-index: 20;
  width: 86%;
  height: 75%;
  overflow: hidden;
  opacity: 0;
  transform: scale(.78) translateY(50px);
  border: 1px solid rgba(255,255,255,.26);
  border-radius: 18px;
  background: var(--panel);
  box-shadow: 0 30px 80px rgba(4, 4, 17, .6);
  transition: opacity .9s, transform .9s cubic-bezier(.2, .9, .2, 1.2);
}

.editor-window.open {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.editor-head {
  height: 9%;
  display: flex;
  align-items: center;
  padding: 0 15px;
  border-bottom: 1px solid rgba(255,255,255,.09);
  background: #22233d;
}

.editor-title {
  margin-left: 29px;
  color: #f1efff;
  font-size: clamp(10px, 1.2vw, 15px);
  font-weight: 700;
}

.editor-layout {
  height: 91%;
  display: grid;
  grid-template-columns: 22% 1fr;
  grid-template-rows: 54% 46%;
}

.media-panel {
  grid-row: 1 / 3;
  padding: 14px;
  border-right: 1px solid rgba(255,255,255,.08);
  background: #20213a;
}

.panel-label {
  margin-bottom: 12px;
  color: #a9a5d7;
  font-size: clamp(8px, 1vw, 12px);
}

.media-card {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 8px;
  padding: 7px;
  border-radius: 7px;
  background: #2d2f50;
  color: #e8e6ff;
  font-size: clamp(7px, .9vw, 11px);
}

.media-card span:first-child {
  width: 30px;
  height: 20px;
  display: grid;
  place-items: center;
  border-radius: 4px;
  background: linear-gradient(135deg, #ff9d62, #7d68f7);
}

.preview {
  position: relative;
  display: grid;
  place-items: center;
  margin: 12px;
  overflow: hidden;
  border-radius: 11px;
  background:
    radial-gradient(circle at 65% 32%, #ffcf72 0 7%, transparent 8%),
    linear-gradient(135deg, #f17973, #704bd1 55%, #273f9b);
}

.preview::after {
  content: "PREVIEW";
  position: absolute;
  left: 11px;
  top: 9px;
  color: rgba(255,255,255,.55);
  font-size: clamp(7px, .8vw, 10px);
  letter-spacing: .12em;
}

.preview-art {
  width: 36%;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 42% 58% 48% 52%;
  background: var(--orange);
  color: #5b2d28;
  font-size: clamp(24px, 4vw, 55px);
  box-shadow: inset -8px -8px 0 rgba(180, 65, 28, .17);
  transform: rotate(-7deg);
}

/* 时间线 */
.timeline {
  position: relative;
  padding: 10px 12px;
  border-top: 1px solid rgba(255,255,255,.08);
  background: #191a2f;
}

.track-name {
  position: absolute;
  left: 10px;
  color: #9995c6;
  font-size: clamp(7px, .8vw, 10px);
}

.track-name.video {
  top: 19px;
}

.track-name.audio {
  top: 70%;
}

.tracks {
  position: absolute;
  left: 52px;
  right: 14px;
  top: 15px;
  bottom: 12px;
}

.track-row {
  position: relative;
  height: 42%;
  margin-bottom: 8%;
  border-radius: 5px;
  background: #242541;
}

.clip {
  position: absolute;
  top: 4px;
  bottom: 4px;
  display: flex;
  align-items: center;
  padding-left: 8px;
  overflow: hidden;
  border-radius: 4px;
  color: white;
  font-size: clamp(7px, .8vw, 10px);
  white-space: nowrap;
  transition: transform .7s cubic-bezier(.2,.9,.2,1), left .7s, opacity .4s;
}

.clip.a {
  left: 0;
  width: 29%;
  background: linear-gradient(90deg, #ff8d62, #ec597e);
}

.clip.b {
  left: 31%;
  width: 25%;
  background: linear-gradient(90deg, #4ccbf0, #5565dc);
}

.clip.c {
  left: 58%;
  width: 38%;
  background: linear-gradient(90deg, #8a63ee, #bf67dc);
}

.clip.audio {
  left: 7%;
  top: 5px;
  width: 66%;
  height: 80%;
  background: repeating-linear-gradient(
    90deg,
    #31bcae 0 5px,
    #238e91 5px 8px
  );
  opacity: .8;
}

.playhead {
  position: absolute;
  top: 2px;
  bottom: 0;
  left: 4%;
  z-index: 3;
  width: 2px;
  background: #ffdf73;
  box-shadow: 0 0 8px #ffdf73;
  transition: left .2s linear;
}

.playhead::before {
  content: "";
  position: absolute;
  left: -4px;
  top: -3px;
  border-left: 5px solid transparent;
  border-right: 5px solid transparent;
  border-top: 7px solid #ffdf73;
}

/* Clawd */
#clawd {
  position: absolute;
  left: 10%;
  top: 72%;
  z-index: 45;
  width: clamp(55px, 9vw, 110px);
  transform: translate(-50%, -50%);
  transform-origin: center bottom;
  transition:
    left 1.2s cubic-bezier(.2,.9,.2,1),
    top 1.2s cubic-bezier(.2,.9,.2,1),
    transform .4s;
  filter: drop-shadow(0 9px 7px rgba(0,0,0,.25));
}

#clawd.walking {
  animation: walkBounce .5s infinite alternate ease-in-out;
}

#clawd.excited {
  animation: excited .38s infinite alternate ease-in-out;
}

#clawd.jumping {
  animation: jumpIn 1.7s cubic-bezier(.2,.9,.2,1) forwards;
}

#clawd.inside {
  z-index: 28;
  left: 67%;
  top: 71%;
  width: clamp(44px, 7vw, 83px);
  animation: workBounce .55s infinite alternate ease-in-out;
}

#clawd.sitting {
  animation: sit .8s forwards;
}

@keyframes walkBounce {
  from { transform: translate(-50%, -50%) rotate(-3deg); }
  to { transform: translate(-50%, -56%) rotate(3deg); }
}

@keyframes excited {
  from { transform: translate(-50%, -50%) scale(1) rotate(-4deg); }
  to { transform: translate(-50%, -60%) scale(1.08) rotate(4deg); }
}

@keyframes jumpIn {
  0% {
    left: 27%;
    top: 72%;
    transform: translate(-50%, -50%) rotate(0) scale(1);
  }
  45% {
    left: 46%;
    top: 25%;
    transform: translate(-50%, -50%) rotate(360deg) scale(1.2);
  }
  100% {
    left: 67%;
    top: 71%;
    transform: translate(-50%, -50%) rotate(720deg) scale(.72);
  }
}

@keyframes workBounce {
  from { transform: translate(-50%, -50%) rotate(-3deg); }
  to { transform: translate(-50%, -54%) rotate(3deg); }
}

@keyframes sit {
  to { transform: translate(-50%, -48%) rotate(0) scale(.88); }
}

.clawd-svg {
  width: 100%;
  height: auto;
  overflow: visible;
}

.speech {
  position: absolute;
  left: 50%;
  top: -42%;
  min-width: 105px;
  padding: 7px 10px;
  border-radius: 12px;
  opacity: 0;
  background: white;
  color: #31264c;
  font-size: clamp(9px, 1vw, 13px);
  font-weight: 700;
  text-align: center;
  transform: translateX(-50%) scale(.7);
  transition: opacity .35s, transform .35s;
}

.speech::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -6px;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-top: 7px solid white;
  transform: translateX(-50%);
}

.speech.show {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}

/* 分镜字幕 */
#caption {
  position: absolute;
  left: 50%;
  bottom: 15%;
  z-index: 60;
  padding: 8px 17px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 999px;
  background: rgba(20, 17, 45, .6);
  color: white;
  font-size: clamp(10px, 1.4vw, 17px);
  font-weight: 700;
  letter-spacing: .05em;
  opacity: 0;
  transform: translateX(-50%) translateY(10px);
  transition: opacity .4s, transform .4s;
  backdrop-filter: blur(8px);
}

#caption.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* 启动层 */
#start-screen {
  position: absolute;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  background: rgba(14, 13, 35, .48);
  backdrop-filter: blur(5px);
  transition: opacity .6s;
}

.start-card {
  width: min(78%, 440px);
  padding: 30px;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 24px;
  background: rgba(30, 28, 65, .84);
  box-shadow: 0 25px 80px rgba(0,0,0,.35);
  text-align: center;
}

.start-card h1 {
  margin: 0 0 8px;
  color: #fff2c7;
  font-size: clamp(22px, 4vw, 42px);
}

.start-card p {
  margin: 0 0 22px;
  color: #c7c4ea;
  font-size: clamp(11px, 1.3vw, 15px);
}

#start-btn {
  padding: 12px 25px;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(135deg, #ff9b5b, #ff5f83);
  color: white;
  cursor: pointer;
  font-size: clamp(13px, 1.4vw, 17px);
  font-weight: 800;
  box-shadow: 0 9px 20px rgba(255, 91, 111, .3);
  transition: transform .2s, box-shadow .2s;
}

#start-btn:hover {
  transform: translateY(-3px) scale(1.04);
  box-shadow: 0 13px 25px rgba(255, 91, 111, .4);
}

/* 底部控制条 */
#controls {
  position: absolute;
  left: 2%;
  right: 2%;
  bottom: 1.4%;
  z-index: 80;
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  transition: opacity .4s;
}

#controls.visible {
  opacity: 1;
}

#play-toggle {
  width: 28px;
  height: 24px;
  border: 0;
  border-radius: 7px;
  background: rgba(255,255,255,.2);
  color: white;
  cursor: pointer;
}

#progress {
  flex: 1;
  height: 5px;
  accent-color: #ff9c68;
  cursor: pointer;
}

#time-label {
  min-width: 45px;
  color: rgba(255,255,255,.8);
  font-size: 11px;
  text-align: right;
}

/* 特效 */
.spark {
  position: absolute;
  z-index: 50;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ffe981;
  pointer-events: none;
  animation: spark .8s ease-out forwards;
}

@keyframes spark {
  to {
    opacity: 0;
    transform: translate(var(--x), var(--y)) scale(.1);
  }
}

.shake {
  animation: shake .35s ease-in-out;
}

@keyframes shake {
  20% { transform: translateX(-7px); }
  40% { transform: translateX(7px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(5px); }
}
</style>
</head>

<body>

<div id="stage">

  <div class="menu-bar">
    <div class="menu-left">
      <span class="apple">●</span>
      <span>ClawdCut</span>
      <span>文件</span>
      <span>编辑</span>
      <span>视图</span>
    </div>
    <div class="menu-right">
      <span>Wi‑Fi</span>
      <span>🔋</span>
      <span id="clock">10:28</span>
    </div>
  </div>

  <div class="desktop-files">
    <div class="file-icon">
      <div class="file-picture">🎬</div>
      素材_01
    </div>
    <div class="file-icon">
      <div class="file-picture">🌈</div>
      素材_02
    </div>
    <div class="file-icon">
      <div class="file-picture">🐾</div>
      素材_03
    </div>
  </div>

  <div class="folder-window" id="folder">
    <div class="window-head">
      <span class="traffic"></span>
      视频素材
    </div>
    <div class="folder-content">
      <div class="video-thumb">🎬</div>
      <div class="video-thumb">🌈</div>
      <div class="video-thumb">🐾</div>
      <div class="video-thumb">☀️</div>
      <div class="video-thumb">🌊</div>
      <div class="video-thumb">⭐</div>
    </div>
  </div>

  <div class="editor-window" id="editor">
    <div class="editor-head">

    <div class="editor-layout">

      <div class="timeline">

        <div class="tracks">
          <div class="track-row">

  <div class="dock">

  </div>

  <!-- 小 Clawd -->
  <div id="clawd">
    <div class="speech" id="speech">让我来试试！</div>

    <svg class="clawd-svg" viewBox="0 0 180 170" aria-label="小 Clawd">
      <!-- 阴影 -->
      <ellipse cx="90" cy="153" rx="54" ry="10" fill="rgba(40,20,50,.28)" />

      <!-- 左钳 -->
      <path d="M36 91 C12 82, 8 59, 26 51 C40 45, 53 60, 48 76"
            fill="#ff8b45" stroke="#a8492d" stroke-width="5"/>
      <path d="M25 52 C10 42, 14 25, 28 26 C39 27, 43 41, 35 50"

      <!-- 右钳 -->
      <path d="M144 91 C168 82, 172 59, 154 51 C140 45, 127 60, 132 76"

      <path d="M155 52 C170 42, 166 25, 152 26 C141 27, 137 41, 145 50"
            fill="#ff9b54" stroke="#a8492d" stroke-width="5"/>

      <!-- 身体 -->
      <path d="M45 65 C45 35, 65 20, 90 20 C115 20, 135 35, 135 65
               L128 127 C125 145, 107 151, 90 151
               C73 151, 55 145, 52 127 Z"
            fill="#ff8b45" stroke="#a8492d" stroke-width="6"/>

      <!-- 肚皮 -->
      <ellipse cx="90" cy="104" rx="27" ry="34" fill="#fff0d2" opacity=".95"/>

      <!-- 眼睛 -->
      <circle cx="70" cy="61" r="12" fill="#fff"/>
      <circle cx="110" cy="61" r="12" fill="#fff"/>
      <circle cx="72" cy="63" r="5" fill="#332440"/>
      <circle cx="108" cy="63" r="5" fill="#332440"/>
      <circle cx="74" cy="60" r="2" fill="#fff"/>
      <circle cx="110" cy="60" r="2" fill="#fff"/>

      <!-- 嘴巴 -->
      <path d="M79 82 Q90 91 101 82" fill="none"
            stroke="#74372f" stroke-width="5" stroke-linecap="round"/>

      <!-- 腿 -->
      <path d="M67 136 L59 153" stroke="#a8492d" stroke-width="8" stroke-linecap="round"/>
      <path d="M113 136 L121 153" stroke="#a8492d" stroke-width="8" stroke-linecap="round"/>

      <!-- 小手 -->
      <circle cx="53" cy="106" r="7" fill="#ffb069"/>
      <circle cx="127" cy="106" r="7" fill="#ffb069"/>
    </svg>
  </div>

  <div id="caption"></div>

  <div id="controls">
    <button id="play-toggle">Ⅱ</button>
    <input id="progress" type="range" min="0" max="35" step=".01" value="0" />
    <span id="time-label">00:00</span>
  </div>

  <div id="start-screen">
    <div class="start-card">
      <h1>小 Clawd 的第一次剪辑</h1>
      <p>一只小螃蟹，打开了一款剪辑软件……</p>
      <button id="start-btn">▶ 开始动画</button>
    </div>
  </div>
</div>

<script>
/* --------------------------
   基础状态
-------------------------- */
const stage = document.querySelector("#stage");
const clawd = document.querySelector("#clawd");
const folder = document.querySelector("#folder");
const editor = document.querySelector("#editor");
const speech = document.querySelector("#speech");
const caption = document.querySelector("#caption");
const playhead = document.querySelector("#playhead");
const progress = document.querySelector("#progress");
const timeLabel = document.querySelector("#time-label");
const controls = document.querySelector("#controls");
const playToggle = document.querySelector("#play-toggle");
const startScreen = document.querySelector("#start-screen");
const startBtn = document.querySelector("#start-btn");

const DURATION = 35;
let elapsed = 0;
let playing = false;
let animationFrame = null;
let lastScene = -1;
let audioContext = null;
let masterGain = null;
let bgmTimer = null;

/* --------------------------
   Web Audio API
-------------------------- */
function initAudio() {
  if (audioContext) return;

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioContext.createGain();
  masterGain.gain.value = 0.06;
  masterGain.connect(audioContext.destination);

  startBGM();
}

function tone(frequency, duration = .1, type = "sine", volume = .12) {
  if (!audioContext) return;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);

  gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(volume, audioContext.currentTime + .01);
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    audioContext.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(masterGain);

  oscillator.start();
  oscillator.stop(audioContext.currentTime + duration + .02);
}

function noise(duration = .08, volume = .08) {
  if (!audioContext) return;

  const buffer = audioContext.createBuffer(
    1,
    audioContext.sampleRate * duration,
    audioContext.sampleRate
  );

  const data = buffer.getChannelData(0);

  for (let i = 0; i < data.length; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();

  source.buffer = buffer;
  gain.gain.setValueAtTime(volume, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    .0001,
    audioContext.currentTime + duration
  );

  source.connect(gain);
  gain.connect(masterGain);
  source.start();
}

function playClick() {
  tone(850, .06, "square", .18);
  tone(1200, .04, "sine", .1);
}

function playJump() {
  if (!audioContext) return;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(260, audioContext.currentTime);
  oscillator.frequency.exponentialRampToValueAtTime(
    760,
    audioContext.currentTime + .55
  );

  gain.gain.setValueAtTime(.0001, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(.2, audioContext.currentTime + .04);
  gain.gain.exponentialRampToValueAtTime(
    .0001,
    audioContext.currentTime + .62
  );

  oscillator.connect(gain);
  gain.connect(masterGain);

  oscillator.start();
  oscillator.stop(audioContext.currentTime + .65);
}

function playSuccess() {
  [523, 659, 784, 1046].forEach((note, index) => {
    setTimeout(() => tone(note, .18, "triangle", .16), index * 95);
  });
}

function startBGM() {
  const notes = [261.63, 329.63, 392, 523.25, 392, 329.63];
  let index = 0;

  bgmTimer = setInterval(() => {
    if (!playing) return;

    const note = notes[index % notes.length];
    tone(note, .18, "triangle", .055);

    if (index % 2 === 0) {
      tone(note / 2, .12, "sine", .035);
    }

    index++;
  }, 360);
}

/* --------------------------
   视觉辅助
-------------------------- */
function setCaption(text) {
  caption.textContent = text;
  caption.classList.toggle("show", Boolean(text));
}

function setSpeech(text, visible = true) {
  speech.textContent = text;
  speech.classList.toggle("show", visible);
}

function makeSparkles(x, y, amount = 12) {
  for (let i = 0; i < amount; i++) {
    const spark = document.createElement("i");
    spark.className = "spark";
    spark.style.left = `${x}%`;
    spark.style.top = `${y}%`;
    spark.style.setProperty("--x", `${(Math.random() - .5) * 130}px`);
    spark.style.setProperty("--y", `${(Math.random() - .5) * 100}px`);
    stage.appendChild(spark);

    setTimeout(() => spark.remove(), 900);
  }
}

function updateClock() {
  const now = new Date();
  document.querySelector("#clock").textContent =
    now.toLocaleTimeString("zh-CN", {
      hour: "2-digit",
      minute: "2-digit"
    });
}

/* --------------------------
   分镜控制
-------------------------- */
function scene0() {
  clawd.className = "";
  clawd.style.left = "10%";
  clawd.style.top = "78%";
  folder.classList.remove("visible");
  editor.classList.remove("open");
  setCaption("");
  setSpeech("", false);
}

function scene1() {
  clawd.className = "walking";
  clawd.style.left = "27%";
  clawd.style.top = "76%";
  setCaption("小 Clawd 发现了一堆视频素材");
  setSpeech("好多素材！");
}

function scene2() {
  clawd.className = "excited";
  clawd.style.left = "21%";
  clawd.style.top = "44%";
  folder.classList.add("visible");
  setCaption("素材好多，好像有点乱……");
  setSpeech("嗯……怎么剪呢？");
}

function scene3() {
  clawd.className = "excited";
  clawd.style.left = "49%";
  clawd.style.top = "24%";
  folder.classList.remove("visible");
  editor.classList.add("open");
  setCaption("打开 ClawdCut");
  setSpeech("打开剪辑软件！");
  makeSparkles(49, 28, 16);
}

function scene4() {
  clawd.className = "jumping";
  clawd.style.left = "27%";
  clawd.style.top = "72%";
  editor.classList.add("open");
  setCaption("直接跳进软件，自己动手！");
  setSpeech("不用等，我来！");
  playJump();

  setTimeout(() => {
    if (elapsed >= 23 && elapsed < 31) {
      clawd.className = "inside";
      setSpeech("开始剪辑！");
      makeSparkles(67, 70, 10);
    }
  }, 1650);
}

function scene5() {
  clawd.className = "inside";
  clawd.style.left = "67%";
  clawd.style.top = "70%";
  editor.classList.add("open");
  setCaption("准备开始剪辑！");
  setSpeech("剪辑开始！");
}

function runScene(scene) {
  if (scene === lastScene) return;
  lastScene = scene;

  switch (scene) {
    case 0:
      scene0();
      break;
    case 1:
      scene1();
      playClick();
      break;
    case 2:
      scene2();
      playClick();
      break;
    case 3:
      scene3();
      playClick();
      break;
    case 4:
      scene4();
      break;
    default:
      scene5();
  }
}

function updateAnimation(timestamp) {
  if (!playing) return;

  elapsed += 1 / 60;

  if (elapsed >= DURATION) {
    elapsed = DURATION;
    playing = false;
    playToggle.textContent = "▶";
  }

  const scene = Math.floor(elapsed / 7);
  runScene(scene);

  progress.value = elapsed;
  timeLabel.textContent =
    `00:${String(Math.floor(elapsed)).padStart(2, "0")}`;

  const progressInsideTimeline = Math.min(
    96,
    Math.max(4, (elapsed / DURATION) * 96)
  );

  playhead.style.left = `${progressInsideTimeline}%`;

  animationFrame = requestAnimationFrame(updateAnimation);
}

/* --------------------------
   播放控制
-------------------------- */
function startAnimation() {
  initAudio();

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  playing = true;
  controls.classList.add("visible");
  startScreen.style.opacity = "0";

  setTimeout(() => {
    startScreen.style.display = "none";
  }, 600);

  if (!animationFrame) {
    animationFrame = requestAnimationFrame(updateAnimation);
  }
}

startBtn.addEventListener("click", () => {
  startAnimation();
});

playToggle.addEventListener("click", () => {
  playing = !playing;
  playToggle.textContent = playing ? "Ⅱ" : "▶";

  if (playing) {
    animationFrame = requestAnimationFrame(updateAnimation);
  }
});

progress.addEventListener("input", () => {
  elapsed = Number(progress.value);
  lastScene = -1;
  runScene(Math.floor(elapsed / 7));
});

stage.addEventListener("click", event => {
  if (
    event.target.closest("#start-btn") ||
    event.target.closest("#controls")
  ) {
    return;
  }

  if (audioContext) {
    playClick();
  }
});

setInterval(updateClock, 1000);
updateClock();
scene0();
</script>

</body>
</html>
