<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鲸鱼女仆的剪辑日常 · Canvas 2D</title>
<style>
  html,body{margin:0;height:100%;background:#0e1430;overflow:hidden;
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:pointer}
  #hud{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);color:#cfe0ff;
    font-size:13px;opacity:.7;user-select:none;white-space:nowrap}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud">点击画面 暂停/继续 · 按 R 重播 · ← → 快退/快进</div>
<script>
/* =========================================================
   鲸鱼女仆的剪辑日常 —— 原生 JS + Canvas 2D，约 30 秒循环
   ========================================================= */
const W = 1280, H = 720, DUR = 30;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const F = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif';
let K = 1;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(innerWidth / W, (innerHeight - 36) / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  K = cv.width / W;
}
addEventListener('resize', resize); resize();

/* ---------- 工具函数 ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const lerp2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
const seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const win = (t, a, b, f = .25) => clamp((t - a) / f) * clamp((b - t) / f);
const rand = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const pa = hex(a), pb = hex(b); return `rgb(${pa.map((v, i) => Math.round(v + (pb[i] - v) * t)).join(',')})`; };

function rrPath(x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function ell(x, y, rx, ry, rot = 0){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); }
function line(a, b, c, d){ ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); }
function sparkle(x, y, r, col){
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r); ctx.fill();
}
function heart(x, y, s, col){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(0, 8);
  ctx.bezierCurveTo(-16, -2, -12, -16, 0, -7); ctx.bezierCurveTo(12, -16, 16, -2, 0, 8);
  ctx.fill(); ctx.restore();
}
function cloud(x, y, s){
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ell(x, y, 26 * s, 14 * s); ctx.fill(); ell(x + 18 * s, y - 8 * s, 18 * s, 14 * s); ctx.fill();
  ell(x - 16 * s, y - 4 * s, 14 * s, 10 * s); ctx.fill();
}

const C = {
  hairD:'#22357f', hair:'#2f4fb0', hairL:'#5b9be0', hairT:'#8cc8f4',
  navy:'#1d2a6b', navy2:'#2c3d8f', skin:'#ffeadf', blush:'rgba(255,135,160,.45)',
  line:'#1a2350', gold:'#d8b45a', bow:'#2f6fe0'
};

/* ---------- 小道具 ---------- */
function drawWhale(x, y, s, col){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(-24, 2);
  ctx.bezierCurveTo(-24, -20, 16, -20, 20, -4);
  ctx.lineTo(32, -14); ctx.lineTo(28, 0); ctx.lineTo(36, 4); ctx.lineTo(20, 6);
  ctx.bezierCurveTo(10, 16, -24, 16, -24, 2); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-6, -14); ctx.lineTo(-6, -22);
  ctx.quadraticCurveTo(-12, -27, -15, -22); ctx.moveTo(-6, -22); ctx.quadraticCurveTo(0, -27, 3, -22); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ell(-13, -3, 2.5, 2.5); ctx.fill();
  ctx.restore();
}
function drawMug(x, y, t, s = 1){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = C.line; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(14, 0, 8, -1.3, 1.3); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(14, 0, 8, -1.3, 1.3); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = C.line; ctx.lineWidth = 2.5;
  rrPath(-14, -14, 28, 30, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#7a4a2e'; ell(0, -12, 11, 3); ctx.fill();
  drawWhale(0, 4, .35, '#3f6fd8');
  ctx.strokeStyle = 'rgba(140,160,215,.75)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++){
    const ph = (t * .8 + i / 3) % 1; ctx.globalAlpha = Math.sin(ph * Math.PI) * .8;
    ctx.beginPath(); const bx = -6 + i * 6;
    for (let k = 0; k <= 8; k++){
      const yy = -18 - k * 4 - ph * 20, xx = bx + Math.sin(k * .9 + t * 3 + i) * 3;
      k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
    }
    ctx.stroke();
  }
  ctx.restore();
}
function drawPlush(x, y, s, t){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(Math.sin(t * 1.5) * .04);
  ctx.fillStyle = '#8cc4f5'; ctx.strokeStyle = C.line; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(40, -5); ctx.quadraticCurveTo(70, -30, 78, -20);
  ctx.quadraticCurveTo(66, -5, 80, 8); ctx.quadraticCurveTo(62, 12, 40, 8); ctx.fill(); ctx.stroke();
  ell(0, 0, 50, 34); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e9f4ff'; ctx.beginPath(); ctx.ellipse(-4, 12, 40, 18, 0, 0, Math.PI); ctx.fill();
  ctx.fillStyle = C.line; ell(-26, -4, 4, 5); ctx.fill(); ell(-6, -4, 4, 5); ctx.fill();
  ctx.fillStyle = C.blush; ell(-34, 6, 6, 3); ctx.fill(); ell(2, 6, 6, 3); ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(-16, 2, 4, .3, Math.PI - .3); ctx.stroke();
  ctx.restore();
}
function bubble(x, y, text, a, dir = -1, size = 26){
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = clamp(a);
  const sc = .5 + .5 * easeOutBack(clamp(a)); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.font = `bold ${size}px ${F}`;
  const w = ctx.measureText(text).width + 40, h = size + 26;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = C.line; ctx.lineWidth = 3;
  rrPath(-w / 2, -h / 2, w, h, h / 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(dir * 10 - 9, h / 2 - 3); ctx.lineTo(dir * 36, h / 2 + 22); ctx.lineTo(dir * 10 + 9, h / 2 - 3); ctx.fill();
  ctx.beginPath(); ctx.moveTo(dir * 10 - 9, h / 2); ctx.lineTo(dir * 36, h / 2 + 22); ctx.lineTo(dir * 10 + 9, h / 2); ctx.stroke();
  ctx.fillStyle = C.line; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, 0, 1);
  ctx.restore();
}
function chip(text){
  ctx.save(); ctx.font = 'bold 20px ' + F;
  const w = ctx.measureText(text).width + 32;
  rrPath(24, 22, w, 40, 20); ctx.fillStyle = 'rgba(255,255,255,.88)'; ctx.fill();
  ctx.strokeStyle = C.line; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = C.line; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(text, 40, 43);
  ctx.restore();
}
function zzz(x, y, t, col = '#5a6fc0'){
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = col;
  for (let i = 0; i < 3; i++){
    const ph = (t * .7 + i / 3) % 1; ctx.globalAlpha = Math.sin(ph * Math.PI);
    ctx.font = `bold ${18 + ph * 18}px ${F}`;
    ctx.fillText('Z', x + ph * 40 + Math.sin(ph * 6) * 6, y - ph * 70);
  }
  ctx.restore();
}
function confetti(cx, cy, age, n = 70){
  if (age < 0 || age > 3) return;
  const cols = ['#ff9d5c', '#6fb6ff', '#ffd36b', '#ff7aa8', '#5fd3a8', '#b59cff'];
  for (let i = 0; i < n; i++){
    const vx = (rand(i) - .5) * 1000, vy = -(350 + rand(i + 50) * 450);
    const x = cx + vx * age, y = cy + vy * age + 700 * age * age;
    if (y > H + 20) continue;
    ctx.save(); ctx.translate(x, y); ctx.rotate(age * (4 + rand(i + 9) * 8) + i);
    ctx.scale(1, Math.cos(age * 8 + i)); ctx.fillStyle = cols[i % 6]; ctx.fillRect(-6, -4, 12, 8);
    ctx.restore();
  }
}

/* =========================================================
   角色：鲸鱼女仆（局部坐标：脚底 = (0,0)，头心 ≈ (0,-322)）
   ========================================================= */
let HANDS = [];
function drawGirl(o){
  const p = Object.assign({x:0, y:0, s:1, t:0, eyes:'open', mouth:'smile', arms:'down',
    tilt:0, blink:true, shadow:true, sip:0, earFlap:0}, o);
  const t = p.t;
  ctx.save(); ctx.translate(p.x, p.y); ctx.scale(p.s, p.s);
  if (p.shadow){ ctx.fillStyle = 'rgba(30,40,100,.16)'; ell(0, 2, 85, 13); ctx.fill(); }
  drawBackHair(t, p.tilt);
  drawLegs();
  drawSkirt(t);
  drawTorso();
  const raised = ['up', 'cheer', 'wave'].includes(p.arms);
  let h;
  if (!raised) h = drawArms(t, p);
  drawHead(t, p);
  if (raised) h = drawArms(t, p);
  if (p.arms === 'mug') drawMug(h[1][0] - 4 - p.sip * 14, h[1][1] - 8, t, 1);
  ctx.restore();
  HANDS = h.map(([x, y]) => [p.x + x * p.s, p.y + y * p.s]);
  return HANDS;
}

function drawBackHair(t, tilt){
  ctx.save(); ctx.translate(0, -240); ctx.rotate(tilt * .6); ctx.translate(0, 240);
  const g = ctx.createLinearGradient(0, -420, 0, -95);
  g.addColorStop(0, C.hairD); g.addColorStop(.5, C.hair); g.addColorStop(.82, C.hairL); g.addColorStop(1, C.hairT);
  ctx.fillStyle = g; ctx.strokeStyle = C.line; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, -322, 102, Math.PI, 0);
  for (let i = 0; i <= 20; i++){
    const k = i / 20, y = -322 + k * 215;
    ctx.lineTo(102 + k * 28 + Math.sin(k * 9 + t * 2) * 8 * k, y);
  }
  const n = 6;
  for (let i = 0; i < n; i++){
    const x0 = 130 - i * (260 / n), x1 = 130 - (i + 1) * (260 / n);
    const yb = -107 + Math.sin(i * 1.7 + t * 2) * 6;
    ctx.quadraticCurveTo((x0 + x1) / 2, yb + 24, x1, yb);
  }
  for (let i = 20; i >= 0; i--){
    const k = i / 20, y = -322 + k * 215;
    ctx.lineTo(-(102 + k * 28 + Math.sin(k * 9 + t * 2 + 1) * 8 * k), y);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(20,30,90,.3)'; ctx.lineWidth = 2;
  for (const s of [-1, 1]) for (let j = 0; j < 3; j++){
    const bx = s * (70 + j * 18);
    ctx.beginPath(); ctx.moveTo(bx, -280);
    ctx.quadraticCurveTo(bx + s * 20 + Math.sin(t * 2 + j) * 6, -200, bx + s * 10, -122); ctx.stroke();
  }
  ctx.restore();
}

function drawLegs(){
  for (const s of [-1, 1]){
    ctx.fillStyle = '#f4f5fb'; ctx.strokeStyle = '#9aa3c7'; ctx.lineWidth = 2.5;
    rrPath(s * 17 - 11, -82, 22, 70, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.navy; ctx.strokeStyle = C.line;
    ell(s * 18, -10, 17, 10); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = C.navy; ctx.lineWidth = 3.5; line(s * 17 - 10, -20, s * 17 + 10, -20);
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ell(s * 18 - 6, -13, 5, 2.5); ctx.fill();
  }
}

function drawSkirt(t){
  const sw = Math.sin(t * 2.2) * 3;
  const g = ctx.createLinearGradient(0, -175, 0, -70);
  g.addColorStop(0, C.navy); g.addColorStop(.6, C.navy2); g.addColorStop(1, '#3d63c4');
  ctx.fillStyle = g; ctx.strokeStyle = C.line; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-36, -176); ctx.lineTo(36, -176);
  ctx.quadraticCurveTo(70, -130, 88 + sw, -78); ctx.quadraticCurveTo(0, -62, -88 + sw, -78);
  ctx.quadraticCurveTo(-70, -130, -36, -176); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = C.gold; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-80 + sw, -96); ctx.quadraticCurveTo(0, -82, 80 + sw, -96); ctx.stroke();
  for (let i = -3; i <= 3; i++) sparkle(i * 22 + sw * .5, -108 + Math.abs(i) * 1.5, 4, C.gold);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#b5bfe3'; ctx.lineWidth = 2;
  for (let i = 0; i <= 9; i++){
    const x = -84 + i * 18.7 + sw, y = -76 + 8 * (1 - Math.pow((x - sw) / 88, 2));
    ell(x, y + 2, 11, 9); ctx.fill(); ctx.stroke();
  }
  // 围裙
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#aab4dc'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-26, -176); ctx.lineTo(26, -176);
  ctx.quadraticCurveTo(52, -130, 52, -98); ctx.quadraticCurveTo(0, -80, -52, -98);
  ctx.quadraticCurveTo(-52, -130, -26, -176); ctx.closePath(); ctx.fill(); ctx.stroke();
  for (let i = 0; i <= 8; i++){
    const k = i / 8, x = lerp(-52, 52, k), y = (1 - k) * (1 - k) * -98 + 2 * (1 - k) * k * -80 + k * k * -98;
    ell(x, y + 1, 7, 6); ctx.fill(); ctx.stroke();
  }
  drawWhale(0, -122, .6, C.navy2);
}

function drawTorso(){
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#9aa6d4'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-44, -232); ctx.quadraticCurveTo(0, -246, 44, -232);
  ctx.lineTo(36, -176); ctx.lineTo(-36, -176); ctx.closePath(); ctx.fill(); ctx.stroke();
  // 围裙肩带
  ctx.lineCap = 'round';
  for (const s of [-1, 1]){
    ctx.strokeStyle = '#aab4dc'; ctx.lineWidth = 10; line(s * 24, -180, s * 36, -230);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; line(s * 24, -180, s * 36, -230);
  }
  ctx.fillStyle = C.navy; for (let i = 0; i < 2; i++){ ell(0, -218 + i * 11, 2.6, 2.6); ctx.fill(); }
  ctx.fillStyle = C.navy; ctx.strokeStyle = C.line; ctx.lineWidth = 2.5;
  rrPath(-39, -201, 78, 27, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.gold; for (const s of [-1, 1]) for (let i = 0; i < 2; i++){ ell(s * 10, -194 + i * 12, 2.6, 2.6); ctx.fill(); }
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1.5; line(-34, -197, 34, -197);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#9aa6d4'; ctx.lineWidth = 2;
  ell(-12, -237, 14, 8, .3); ctx.fill(); ctx.stroke(); ell(12, -237, 14, 8, -.3); ctx.fill(); ctx.stroke();
  // 领结
  ctx.fillStyle = C.navy; ctx.strokeStyle = C.line; ctx.lineWidth = 2;
  for (const s of [-1, 1]){
    ctx.beginPath(); ctx.moveTo(0, -234); ctx.lineTo(s * 21, -245); ctx.lineTo(s * 21, -223); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -232); ctx.lineTo(s * 9, -212); ctx.lineTo(s * 3, -214); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#4aa3ff'; ell(0, -234, 6, 6); ctx.fill(); ctx.strokeStyle = C.gold; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ell(-2, -236, 1.6, 1.6); ctx.fill();
}

function arm(side, a1, a2){
  const px = side * 38, py = -224;
  const ex = px + Math.sin(a1) * side * 36, ey = py + Math.cos(a1) * 36;
  const hx = ex + Math.sin(a2) * side * 32, hy = ey + Math.cos(a2) * 32;
  const fx = hx - (hx - ex) * .22, fy = hy - (hy - ey) * .22;
  ctx.lineCap = 'round';
  ctx.strokeStyle = C.line; ctx.lineWidth = 25; line(px, py, ex, ey); ctx.lineWidth = 21; line(ex, ey, fx, fy);
  ctx.strokeStyle = C.navy2; ctx.lineWidth = 20; line(px, py, ex, ey); ctx.lineWidth = 16; line(ex, ey, fx, fy);
  ctx.strokeStyle = C.gold; ctx.lineWidth = 1.5; line(lerp(ex, fx, .35), lerp(ey, fy, .35), lerp(ex, fx, .7), lerp(ey, fy, .7));
  ctx.fillStyle = C.navy2; ctx.strokeStyle = C.line; ctx.lineWidth = 2.5; ell(px, py + 4, 16, 15); ctx.fill(); ctx.stroke();
  const ang = Math.atan2(hy - ey, hx - ex);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#9aa6d4'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(fx, fy, 11, 7, ang + Math.PI / 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.skin; ctx.strokeStyle = '#d9a99a'; ell(hx, hy, 9.5, 9.5); ctx.fill(); ctx.stroke();
  return [hx, hy];
}
function drawArms(t, p){
  let L, R;
  switch (p.arms){
    case 'up': L = [2.55, 2.95]; R = [2.55, 2.95]; break;
    case 'cheer': { const w = Math.sin(t * 14) * .22; L = [2.25 + w, 2.65 + w]; R = [2.25 - w, 2.65 - w]; break; }
    case 'wave': L = [.32, .18]; R = [2.3, 2.6 + Math.sin(t * 10) * .4]; break;
    case 'type': { const j1 = Math.sin(t * 25) * .08, j2 = Math.cos(t * 22) * .08; L = [.25, -1.1 + j1]; R = [.25, -1.1 + j2]; break; }
    case 'mug': L = [.32, .18]; R = [.1 + p.sip * 1.0, -2.35 - p.sip * .45]; break;
    default: L = [.32, .18]; R = [.32, .18];
  }
  return [arm(-1, ...L), arm(1, ...R)];
}

function drawHead(t, p){
  ctx.save(); ctx.translate(0, -245); ctx.rotate(p.tilt); ctx.translate(0, 245);
  ctx.fillStyle = '#f6d6c8'; ctx.fillRect(-9, -258, 18, 18);
  ctx.fillStyle = C.skin; ctx.strokeStyle = '#d9a99a'; ctx.lineWidth = 2.5;
  ell(0, -312, 74, 66); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.blush; ell(-46, -284, 13, 7); ctx.fill(); ell(46, -284, 13, 7); ctx.fill();
  drawEyes(t, p); drawMouth(p);
  drawFrontHair(t); drawEars(t, p); drawHeadband(); drawBow(t); drawAhoge(t);
  ctx.restore();
}
function drawEyes(t, p){
  let mode = p.eyes;
  if (p.blink && mode === 'open' && (t % 3.7) < .12) mode = 'closed';
  for (const s of [-1, 1]){
    const x = s * 30, y = -298;
    ctx.strokeStyle = '#121a40'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    if (mode === 'open' || mode === 'sleepy'){
      const ry = mode === 'sleepy' ? 11 : 20, cy = mode === 'sleepy' ? y + 6 : y;
      ctx.fillStyle = '#fff'; ell(x, cy, 16, ry); ctx.fill();
      ctx.save(); ell(x, cy, 16, ry); ctx.clip();
      const g = ctx.createLinearGradient(0, y - 20, 0, y + 20);
      g.addColorStop(0, '#14286e'); g.addColorStop(.5, '#2f63d0'); g.addColorStop(1, '#8fd0ff');
      ctx.fillStyle = g; ell(x, y + 1, 14, 19); ctx.fill();
      ctx.fillStyle = '#0d1a4a'; ell(x, y - 1, 7, 10); ctx.fill();
      ctx.fillStyle = '#fff'; ell(x - 5, y - 9, 5, 6); ctx.fill(); ell(x + 5, y + 8, 2.5, 2.5); ctx.fill();
      ctx.restore();
      ctx.beginPath(); ctx.ellipse(x, cy, 17, ry + 1, 0, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
      line(x + s * 15, cy - ry * .5, x + s * 22, cy - ry * .8);

    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px ' + F; ctx.fillText('上传中… ' + Math.floor(seg(lt, 0, .75) * 100) + '%', 920, 186);
    ctx.fillStyle = '#ffffff44'; rrPath(830, 206, 180, 8, 4); ctx.fill();
    ctx.fillStyle = '#ff7a59'; rrPath(830, 206, Math.max(8, 180 * seg(lt, 0, .75)), 8, 4); ctx.fill();
  }
  ctx.textAlign = 'left'; ctx.fillStyle = C.navy; ctx.font = 'bold 16px ' + F; ctx.fillText('Vlog #128 | 鲸鱼女仆的剪辑日常', 790, 300);
  const views = Math.floor(12846 * ease(seg(lt, .8, 3.2))), likes = Math.floor(3210 * ease(seg(lt, .9, 3.3)));
  const fmt = n => n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n);
  ctx.fillStyle = '#7a86b8'; ctx.font = '13px ' + F; ctx.fillText(`${fmt(views)} 次播放 · ${lt < .8 ? '上传中' : '刚刚发布 ✔'}`, 790, 326);
  const lp = 1 + Math.max(0, Math.sin(lt * 10)) * .15 * (lt > .9 ? 1 : 0);
  ctx.save(); ctx.translate(808, 358); ctx.scale(lp, lp); heart(0, 0, 1.2, '#ff5c8a'); ctx.restore();
  ctx.fillStyle = '#ff5c8a'; ctx.font = 'bold 15px ' + F; ctx.fillText(fmt(likes), 828, 358);
  const cm = [['小鲸鱼', '好可爱!!', '#6fb6ff'], ['剪辑大师', '转场太丝滑了 ✦', '#ff9d5c'], ['路人A', '催更催更~', '#ff7aa8']];
  cm.forEach(([n, txt, col], i) => {
    const a = seg(lt, 1.0 + i * .55, 1.35 + i * .55); if (a <= 0) return;
    const ox = (1 - easeOutBack(a)) * 120, y = 400 + i * 78;
    ctx.globalAlpha = a;
    ctx.fillStyle = col; ell(806 + ox, y + 14, 16, 16); ctx.fill();
    ctx.fillStyle = '#7a86b8'; ctx.font = '12px ' + F; ctx.fillText(n, 830 + ox, y);
    ctx.fillStyle = '#f1f4ff'; rrPath(830 + ox, y + 10, 210, 32, 12); ctx.fill();
    ctx.fillStyle = C.navy; ctx.font = '14px ' + F; ctx.fillText(txt, 842 + ox, y + 26);
    ctx.globalAlpha = 1;
  });
  ctx.restore();
  ctx.fillStyle = '#000'; rrPath(880, 66, 80, 20, 10); ctx.fill();
  const hc = ['#ff5c8a', '#ff9d5c', '#ff7aa8', '#6fb6ff'];
  for (let i = 0; i < 16; i++){
    const age = lt - (.9 + i * .15); if (age < 0 || age > 1.8) continue;
    ctx.globalAlpha = 1 - age / 1.8;
    heart(1100 + Math.sin(age * 4 + i) * 25 + (rand(i) - .5) * 60, 380 - age * 230, 1.2 + rand(i + 4), hc[i % 4]);
  }
  ctx.globalAlpha = 1;
  const wave = lt >= 1.4;
  drawGirl({x:400, y:690, s:1.05, t:lt, eyes:wave ? 'open' : 'happy', mouth:'open', arms:wave ? 'wave' : 'cheer',
    tilt:Math.sin(lt * 4) * .05, earFlap:Math.sin(lt * 12) * .12});
  bubble(560, 170, '谢谢大家~!', win(lt, 1.5, 3.4), -1, 28);
  chip('✦ PM 7:00 发布!');
}
function sceneNight(lt){
  bgRoom(true, lt);
  nightstand(lt, false, true);
  bedBack(true);
  drawGirl({x:430, y:800, t:lt, eyes:'closed', mouth:'smile', arms:'down', tilt:.2, shadow:false, blink:false});
  bedFront(true);
  drawPlush(588, 538, .8, lt);
  ctx.fillStyle = 'rgba(10,15,50,.18)'; ctx.fillRect(0, 0, W, H);
  zzz(530, 400, lt, '#cfd9ff');
  const a = seg(lt, .5, 1.1);
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.font = 'bold 36px ' + F; ctx.fillText('今天的视频也剪完啦 ✦', 430, 150 - (1 - a) * 12);
  ctx.fillStyle = '#cfe0ff'; ctx.font = '22px ' + F; ctx.fillText('明天也要元气满满地剪辑哦～ 晚安', 430, 200);
  ctx.globalAlpha = seg(lt, 2.0, 2.5); ctx.fillStyle = '#ffd36b'; ctx.font = 'italic bold 52px Georgia,serif'; ctx.fillText('Fin.', 430, 280);
  ctx.restore();
  chip('☾ PM 11:30');
}

/* =========================================================
   主循环
   ========================================================= */
function render(T){
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.lineJoin = 'round';
  if (T < 5) sceneMorning(T);
  else if (T < 9) sceneKitchen(T - 5);
  else if (T < 23) sceneStudio(T - 9);
  else if (T < 26.5) sceneUpload(T - 23);
  else sceneNight(T - 26.5);
  for (const b of [5, 9, 23, 26.5]){
    const a = 1 - Math.abs(T - b) / .35;
    if (a > 0){ ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(0, 0, W, H); }
  }
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * .95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(10,15,50,.22)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (T < .4){ ctx.fillStyle = `rgba(14,20,48,${1 - T / .4})`; ctx.fillRect(0, 0, W, H); }
  if (T > 29.5){ ctx.fillStyle = `rgba(14,20,48,${(T - 29.5) / .5})`; ctx.fillRect(0, 0, W, H); }
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(0, H - 4, W, 4);
  ctx.fillStyle = '#ff9d5c'; ctx.fillRect(0, H - 4, W * T / DUR, 4);
}

let start = performance.now(), paused = false, pauseAt = 0, cur = 0;
function frame(now){
  cur = paused ? pauseAt : ((now - start) / 1000) % DUR;
  render(cur);
  requestAnimationFrame(frame);
}
function seek(t){ t = (t + DUR) % DUR; if (paused) pauseAt = t; else start = performance.now() - t * 1000; }
cv.addEventListener('click', () => {
  if (paused){ paused = false; start = performance.now() - pauseAt * 1000; }
  else { paused = true; pauseAt = cur; }
});
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') seek(0);
  if (e.key === 'ArrowRight') seek(cur + 2);
  if (e.key === 'ArrowLeft') seek(cur - 2);
  if (e.key === ' '){ e.preventDefault(); cv.click(); }
});
requestAnimationFrame(frame);
</script>
